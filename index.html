<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123c60"><title>국소배기장치 필요환기량 계산기</title><link rel="manifest" href="manifest.webmanifest?v=12"><style>*{box-sizing:border-box}body{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;background:#f2f5f9;color:#183044;margin:0}main{max-width:650px;margin:auto;padding:18px}header{background:#123c60;color:white;padding:22px;border-radius:14px}h1{font-size:1.32rem;margin:0 0 8px}h2{font-size:1.03rem;margin:0 0 13px}.card{background:white;border:1px solid #dbe3eb;border-radius:14px;padding:20px;margin-top:15px}.muted{font-size:.83rem;color:#627487}.field{margin:12px 0}label{display:block;font-weight:600;margin-bottom:6px}input,select{width:100%;border:1px solid #b9c9d7;border-radius:9px;padding:12px;font-size:1rem;background:white}input:focus,select:focus{outline:2px solid #3679aa}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.result{background:#e9f3fb;border-radius:12px;padding:17px;margin-top:12px}.number{font-size:2.2rem;font-weight:800;overflow-wrap:anywhere}.error{color:#a62626;font-weight:bold}button{width:100%;background:#123c60;color:white;border:0;border-radius:9px;padding:13px;font-size:1rem;font-weight:600;margin-top:12px;cursor:pointer}button:disabled{background:#9caebc}.formula{font-size:.98rem;overflow-wrap:anywhere}.hidden{display:none}footer{margin:18px 0;font-size:.79rem;color:#687c8a}</style></head><body><main><header><h1>국소배기장치 필요환기량 계산기</h1><div>Local Exhaust Ventilation · v1.2 (cm 입력)</div></header><section class="card"><h2>1. 후드 종류</h2><label for="hood">후드 형식</label><select id="hood"><option value="booth">부스식 (밀폐식)</option><option value="general" selected>외부식 ① 일반형</option><option value="flanged">외부식 ② 플랜지 일반형</option><option value="slot">외부식 ③ 슬롯형</option><option value="flangedSlot">외부식 ④ 플랜지 슬롯형</option><option value="canopy">캐노피 후드</option></select><div id="shapeBlock" class="field"><label for="shape">후드 개구부 형태 (일반형만 적용)</label><select id="shape"><option value="circle">원형</option><option value="rect">사각형</option></select></div></section><section class="card"><h2>2. 설계 변수</h2><p class="muted" style="font-weight:700;color:#155e8d">길이·거리·지름·둘레는 모두 cm로 입력하세요. 계산 시 m로 자동 변환됩니다.</p><div id="fields"></div></section><section class="card"><h2>3. 계산 결과</h2><div class="muted">적용 공식</div><p id="formula" class="formula"></p><div class="result"><div class="muted">필요환기량 Q</div><div id="output" class="number">—</div><div id="validation"></div></div><button id="copy">계산 결과 복사</button></section><footer>길이 입력: cm (계산 시 m로 자동 환산) · 속도: m/s · 환기량: m³/min. 설계 적용 시 후드 조건과 공식의 적합성을 별도로 검토하세요.</footer></main><script>
const ids=['hood','shape'];const hood=document.getElementById('hood'),shape=document.getElementById('shape'),fields=document.getElementById('fields'),result=document.getElementById('output'),validation=document.getElementById('validation'),formula=document.getElementById('formula');const specs={vc:['제어속도 Vc (m/s)',.5],x:['오염원과 후드 사이 거리 X (cm)',30],dia:['후드 지름 D (cm)',30],w:['후드 개구부 가로 W (cm)',30],h:['후드 개구부 높이 H (cm)',30],l:['슬롯 길이 L (cm)',120],sw:['슬롯 폭 W (cm)',10],bw:['개구부 가로 W (cm)',120],bh:['개구부 높이 H (cm)',80],p:['후드 개구면 둘레길이 P (cm)',300],v:['유입속도 V (m/s)',.5],dist:['오염원으로부터 수직거리 d (cm)',50]};const lengthKeys=new Set(['x','dia','w','h','l','sw','bw','bh','p','dist']);const values=Object.fromEntries(Object.entries(specs).map(([k,v])=>[k,String(v[1])]));let currentQ=null;const fmt=n=>n.toLocaleString('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1});
function layout(){let type=hood.value,normal=['general','flanged'].includes(type),slot=['slot','flangedSlot'].includes(type);document.getElementById('shapeBlock').classList.toggle('hidden',!normal);let keys=type==='booth'?['vc','bw','bh']:type==='canopy'?['p','v','dist']:slot?['vc','x','l','sw']:shape.value==='circle'?['vc','x','dia']:['vc','x','w','h'];fields.replaceChildren();for(const k of keys){let wrap=document.createElement('div');wrap.className='field';let lab=document.createElement('label');lab.htmlFor='field-'+k;lab.textContent=specs[k][0];let input=document.createElement('input');input.id='field-'+k;input.type='number';input.min='0';input.step='any';input.inputMode='decimal';input.value=values[k];input.addEventListener('input',()=>{values[k]=input.value;calculate()});wrap.append(lab,input);fields.append(wrap)}calculate()}
function calculate(){const type=hood.value,normal=['general','flanged'].includes(type),slot=['slot','flangedSlot'].includes(type),keys=Array.from(fields.querySelectorAll('input')).map(el=>el.id.substring(6));const valid=keys.every(k=>values[k].trim()!==''&&Number.isFinite(Number(values[k]))&&Number(values[k])>0);const a=Object.fromEntries(Object.keys(values).map(k=>[k,Number(values[k])/(lengthKeys.has(k)?100:1)]));let q=NaN,warning='';if(type==='booth'){formula.textContent='Q = 60 × Vc × W × H';q=60*a.vc*a.bw*a.bh}else if(type==='canopy'){formula.textContent='Q = 60 × 1.4 × P × V × d';q=60*1.4*a.p*a.v*a.dist}else if(slot){const factor=type==='slot'?3.7:2.6;formula.textContent=`Q = 60 × ${factor} × L × Vc × X`;q=60*factor*a.l*a.vc*a.x;if(valid&&a.l/a.sw<=5)warning='슬롯후드가 아닙니다. (L/W ≤ 5)'}else{const f=type==='flanged'?.75:1,area=shape.value==='circle'?Math.PI*(a.dia/2)**2:a.w*a.h;formula.textContent=`Q = 60 × ${f} × Vc × (10X² + ${shape.value==='circle'?'π(D/2)²':'WH'})`;q=60*f*a.vc*(10*a.x*a.x+area)}currentQ=valid&&!warning?q:null;result.textContent=currentQ===null?'—':fmt(currentQ)+' m³/min';validation.textContent=!valid?'모든 입력값에 0보다 큰 숫자를 넣으세요.':warning;validation.className=(!valid||warning)?'error':'';document.getElementById('copy').disabled=currentQ===null}
hood.addEventListener('change',layout);shape.addEventListener('change',layout);document.getElementById('copy').addEventListener('click',async()=>{if(currentQ===null)return;const s=`${hood.options[hood.selectedIndex].text}${['general','flanged'].includes(hood.value)?' / '+shape.options[shape.selectedIndex].text:''}\n${Array.from(fields.querySelectorAll('input')).map(el=>specs[el.id.substring(6)][0]+': '+el.value).join('\n')}\nQ = ${fmt(currentQ)} m³/min`;try{await navigator.clipboard.writeText(s);alert('계산 결과를 복사했습니다.')}catch(e){alert('이 브라우저에서는 복사를 지원하지 않습니다.')}});layout();if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
